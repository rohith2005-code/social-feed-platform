<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SocialConnect</title>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
    <!-- Loader overlay -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <main class="auth-layout">
        <div class="auth-hero">
            <div class="hero-content">
                <div class="logo-wrapper">
                    <i class="ph-fill ph-planet"></i>
                    <h1>SocialConnect</h1>
                </div>
                <p>Join the conversation. Connect with the world, one post at a time.</p>
                
                <div class="glass-decoration"></div>
                <div class="glass-decoration secondary"></div>
            </div>
        </div>
        <div class="auth-form-container">
            <div class="form-wrapper glass-panel">
                <div class="mobile-logo">
                    <i class="ph-fill ph-planet"></i>
                    <h2>SocialConnect</h2>
                </div>
                <h2>Welcome Back</h2>
                <p class="subtitle">Enter your credentials to access your feed.</p>
                
                <form id="login-form" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-icon-wrapper">
                            <i class="ph ph-user"></i>
                            <input type="text" id="username" name="username" placeholder="johndoe" required autocomplete="username">
                        </div>
                        <span class="error-text" id="username-error"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-icon-wrapper">
                            <i class="ph ph-lock-key"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password" tabindex="-1">
                                <i class="ph ph-eye"></i>
                            </button>
                        </div>
                        <span class="error-text" id="password-error"></span>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="remember-me" name="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block" id="login-submit">
                        <span>Sign In</span>
                        <i class="ph ph-arrow-right"></i>
                    </button>
                </form>
                
                <p class="auth-switch">
                    Don't have an account? <a href="register.html">Create one</a>
                </p>
            </div>
        </div>
    </main>

    <!-- JS -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
