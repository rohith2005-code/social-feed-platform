<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SocialConnect</title>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="app-body">
    <!-- Loader overlay -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="main-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="ph-fill ph-planet"></i>
                    <h2>SocialConnect</h2>
                </div>
                <button class="mobile-menu-close" id="close-sidebar">
                    <i class="ph ph-x"></i>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="feed.html" class="nav-item">
                    <i class="ph ph-house"></i>
                    <span>Home</span>
                </a>
                <a href="profile.html" class="nav-item active">
                    <i class="ph-fill ph-user"></i>
                    <span>Profile</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="btn btn-primary btn-block" id="new-post-btn-sidebar" onclick="window.location.href='feed.html'">
                    <span>Post</span>
                    <i class="ph-bold ph-feather"></i>
                </button>
                <div class="user-profile-mini">
                    <div class="avatar" id="current-user-avatar">SC</div>
                    <div class="user-info">
                        <span class="username" id="current-username">@user</span>
                    </div>
                    <button id="logout-btn" class="logout-btn" title="Logout">
                        <i class="ph ph-sign-out"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header with-back">
                <div class="header-left">
                    <button class="back-btn" onclick="window.location.href='feed.html'">
                        <i class="ph ph-arrow-left"></i>
                    </button>
                    <div>
                        <h1 id="profile-header-name">Profile</h1>
                        <span class="post-count" id="profile-post-count">0 posts</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="theme-toggle">
                        <i class="ph ph-moon"></i>
                    </button>
                </div>
            </header>

            <div class="profile-container">
                <!-- Profile Header -->
                <div class="profile-hero glass-panel">
                    <div class="profile-cover"></div>
                    <div class="profile-details">
                        <div class="profile-avatar-large" id="profile-avatar">SC</div>
                        <div class="profile-actions">
                            <button class="btn btn-outline" id="edit-profile-btn">Edit Profile</button>
                        </div>
                        <div class="profile-info">
                            <h2 id="profile-name">User Name</h2>
                            <p class="profile-handle" id="profile-handle">@username</p>
                            <p class="profile-bio">Joined the conversation.</p>
                            
                            <div class="profile-stats">
                                <div class="stat">
                                    <span class="stat-value">124</span>
                                    <span class="stat-label">Following</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-value">8,192</span>
                                    <span class="stat-label">Followers</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="profile-tabs">
                    <button class="tab active">Posts</button>
                    <button class="tab">Likes</button>
                </div>

                <!-- User Posts -->
                <div class="posts-feed" id="user-posts-container">
                    <!-- User's posts will be injected here by JS -->
                    <div class="empty-state hidden" id="empty-user-posts">
                        <i class="ph-duotone ph-pencil-slash"></i>
                        <h3>No posts yet</h3>
                        <p>When you share something, it will show up here.</p>
                    </div>
                    
                    <div class="feed-loader" id="profile-loader">
                        <div class="spinner small"></div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Right Sidebar -->
        <aside class="right-sidebar">
            <div class="widget glass-panel">
                <h3>Who to follow</h3>
                <ul class="suggestion-list">
                    <li class="suggestion-item">
                        <div class="avatar small">AD</div>
                        <div class="suggestion-info">
                            <span class="suggestion-name">Admin</span>
                            <span class="suggestion-handle">@admin</span>
                        </div>
                        <button class="btn btn-small btn-primary">Follow</button>
                    </li>
                    <li class="suggestion-item">
                        <div class="avatar small">JD</div>
                        <div class="suggestion-info">
                            <span class="suggestion-name">Jane Doe</span>
                            <span class="suggestion-handle">@janedoe</span>
                        </div>
                        <button class="btn btn-small btn-primary">Follow</button>
                    </li>
                </ul>
            </div>
        </aside>
    </div>

    <!-- JS -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
